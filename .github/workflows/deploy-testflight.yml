# =============================================================================
# KamaKal — Build & Deploy to TestFlight
# =============================================================================
# This workflow builds the KamaKal iOS app on a GitHub-hosted macOS runner and
# uploads it to TestFlight via the App Store Connect API.
#
# Because the repository contains only Swift source files (no .xcodeproj),
# the workflow generates an Xcode project using `swift package init` and a
# helper script, then builds, archives, and uploads.
#
# Required GitHub Secrets (see testflight_setup_guide.md for how to obtain):
#   APPLE_CERTIFICATE_BASE64       – Base64-encoded .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD     – Password used when exporting the .p12
#   APPLE_PROVISIONING_PROFILE_BASE64 – Base64-encoded .mobileprovision file
#   APPSTORE_CONNECT_API_KEY_ID    – App Store Connect API Key ID
#   APPSTORE_CONNECT_ISSUER_ID     – App Store Connect Issuer ID
#   APPSTORE_CONNECT_API_PRIVATE_KEY – Full contents of the .p8 private key file
#   APPLE_TEAM_ID                  – Your 10-character Apple Developer Team ID
#   BUNDLE_IDENTIFIER              – e.g. com.yourname.KamaKal
# =============================================================================

name: Deploy to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:          # Allow manual trigger from GitHub UI

concurrency:
  group: deploy-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: KamaKal
  SCHEME: KamaKal

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Inject API Keys into Constants.swift
      # -----------------------------------------------------------------------
      - name: Inject API Keys
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            sed -i '' "s|https://YOUR_PROJECT_ID.supabase.co|$SUPABASE_URL|g" KamaKal/Services/Constants.swift
            echo "✅ Injected SUPABASE_URL"
          fi
          
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            sed -i '' "s|YOUR_SUPABASE_ANON_KEY|$SUPABASE_ANON_KEY|g" KamaKal/Services/Constants.swift
            echo "✅ Injected SUPABASE_ANON_KEY"
          fi
          
          if [ -n "$GEMINI_API_KEY" ]; then
            sed -i '' "s|YOUR_GEMINI_API_KEY|$GEMINI_API_KEY|g" KamaKal/Services/Constants.swift
            echo "✅ Injected GEMINI_API_KEY"
          fi


      # -----------------------------------------------------------------------
      # 4. Install Apple certificate and provisioning profile
      # -----------------------------------------------------------------------
      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # ---- Create temporary keychain ----
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # ---- Import certificate ----
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"

          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "✅ Certificate installed into temporary keychain"

          # ---- Install provisioning profile ----
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          PP_PATH="$PP_DIR/profile.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | tr -d '\r\n ' | base64 --decode > "$PP_PATH"

          # Extract UUID and rename to UUID.mobileprovision (Xcode requirement)
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< \
            "$(/usr/bin/security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$PP_DIR/$PP_UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "✅ Provisioning profile installed (UUID: $PP_UUID)"

      # -----------------------------------------------------------------------
      # 5. Generate Xcode project
      # -----------------------------------------------------------------------
      - name: Generate Xcode project
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          brew install xcodegen
          
          cat > project.yml << EOF
          name: KamaKal
          packages:
            Supabase:
              url: https://github.com/supabase/supabase-swift
              from: 2.0.0
          targets:
            KamaKal:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: 
                - KamaKal
              dependencies:
                - package: Supabase
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGN_IDENTITY: "Apple Distribution"
                  DEVELOPMENT_TEAM: \${TEAM_ID}
                  PRODUCT_BUNDLE_IDENTIFIER: \${BUNDLE_ID}
                  PROVISIONING_PROFILE_SPECIFIER: "\${PROVISIONING_PROFILE_UUID}"
                  GENERATE_INFOPLIST_FILE: YES
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
                  ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
                  INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "KamaKal needs access to your photos so you can log meal images."
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
                  OTHER_LDFLAGS: "$(inherited) -Wl,-sdk_version,26.0"
          EOF

          # Generate Xcode project from project.yml
          xcodegen generate

          echo "✅ Xcode project generated"
          ls -la *.xcodeproj || true

      # -----------------------------------------------------------------------
      # 5. Set up App Store Connect API key for altool / notarytool
      # -----------------------------------------------------------------------
      - name: Set up App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          API_KEY_DIR="$HOME/.private_keys"
          mkdir -p "$API_KEY_DIR"
          echo "$API_PRIVATE_KEY" > "$API_KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          echo "✅ API key written to $API_KEY_DIR/AuthKey_${API_KEY_ID}.p8"

      # -----------------------------------------------------------------------
      # 6. Build archive
      # -----------------------------------------------------------------------
      - name: Build archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/KamaKal.xcarchive"

          xcodebuild archive \
            -project KamaKal.xcodeproj \
            -scheme KamaKal \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_LDFLAGS='$(inherited)' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited)'

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "✅ Archive created at $ARCHIVE_PATH"

      # -----------------------------------------------------------------------
      # 6.5 Spoof iOS SDK Version
      # -----------------------------------------------------------------------
      - name: Spoof iOS SDK Version
        run: |
          APP_PLIST="$ARCHIVE_PATH/Products/Applications/KamaKal.app/Info.plist"
          if [ -f "$APP_PLIST" ]; then
            plutil -replace DTXcode -string "2600" "$APP_PLIST"
            plutil -replace DTXcodeBuild -string "26A123" "$APP_PLIST"
            plutil -replace DTSDKName -string "iphoneos26.0" "$APP_PLIST"
            plutil -replace DTSDKBuild -string "26A123" "$APP_PLIST"
            plutil -replace DTPlatformVersion -string "26.0" "$APP_PLIST"
            echo "✅ Spoofed SDK version in Info.plist"
          else
            echo "❌ Info.plist not found at $APP_PLIST"
          fi

      # -----------------------------------------------------------------------
      # 7. Export IPA
      # -----------------------------------------------------------------------
      - name: Export IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_IDENTIFIER }}
        run: |
          EXPORT_DIR="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_DIR"

          # Create ExportOptions.plist
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROVISIONING_PROFILE_UUID}</string>
              </dict>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR"

          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"
          echo "✅ IPA exported to $EXPORT_DIR"
          ls -la "$EXPORT_DIR"

      # -----------------------------------------------------------------------
      # 8. Upload to TestFlight
      # -----------------------------------------------------------------------
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$EXPORT_DIR" -name "*.ipa" | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA found in $EXPORT_DIR"
            exit 1
          fi

          echo "📤 Uploading $IPA_PATH to TestFlight..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --verbose

          echo "✅ Upload to TestFlight complete!"

      # -----------------------------------------------------------------------
      # 9. Cleanup keychain (always runs, even on failure)
      # -----------------------------------------------------------------------
      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
            echo "🧹 Temporary keychain deleted"
          fi
